[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metasra-pipeline"
version = "0.1.0"
description = "MetaSRA pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Matthew Bernstein" },
  { name = "Colin Dewey" },
  { name = "Yuriy Sverchkov" },
]
license = "BSD-3-Clause"
keywords = ["metasra", "bioinformatics", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "marisa-trie",
    "nltk",
    "pybktree"
]

[project.urls]
Repository = "https://github.com/deweylab/MetaSRA-pipeline"
Issues = "https://github.com/deweylab/MetaSRA-pipeline/issues"
Website = "https://github.com/deweylab/MetaSRA-pipeline"

[project.scripts]
metasra = "metasra.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"metasra.setup_map_sra_to_ontology" = ["*.json"]
"metasra.map_sra_to_ontology" = [
    "*.json",
    "metadata/*.json",
    "synonym_sets/*.json",
    "predict_sample_type/*.json",
    "predict_sample_type/*.pickle",
]
